[package]
name = "fleet-memory"
version = "0.1.0"
edition = "2021"
description = "Streaming memory index with sqlite-vec, provider-tagged schemas, and crash recovery"
license = "MIT"

[[bin]]
name = "fleet-memory"
path = "src/main.rs"

[dependencies]
# SQLite
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }

# sqlite-vec — loadable extension via the Rust crate
sqlite-vec = "0.1.6-alpha"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# File walking
walkdir = "2"

# Regex
regex = "1"

# HTTP client for embedding API (rustls, NOT openssl)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# Misc
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
